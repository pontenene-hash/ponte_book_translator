<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:sans-serif;color:#214d47}canvas{display:block;width:100%;touch-action:none;border-radius:8px}p{font-size:14px;margin:5px 0}</style><p id="help"></p><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let points=[],args={},img=new Image(),active=-1,identity='';
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function size(){if(!img.naturalWidth)return;c.width=Math.min(850,window.innerWidth);c.height=c.width*img.naturalHeight/img.naturalWidth;draw();send('streamlit:setFrameHeight',{height:c.height+50});}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const cols=['#ed462f','#009b73','#3f75ee'];let groups=args.mode==='quad'?[points]:[points.slice(0,5),points.slice(5,10),points.slice(10,15)];groups.forEach((g,k)=>{ctx.strokeStyle=cols[k];ctx.lineWidth=3;ctx.beginPath();g.forEach((p,i)=>{let x=p[0]*c.width/100,y=p[1]*c.height/100;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(args.mode==='quad')ctx.closePath();ctx.stroke();g.forEach(p=>{ctx.beginPath();ctx.arc(p[0]*c.width/100,p[1]*c.height/100,9,0,7);ctx.fillStyle=cols[k];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke()})})}
function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*100/r.width,(e.clientY-r.top)*100/r.height]}
c.onpointerdown=e=>{let p=pos(e),best=Infinity;points.forEach((q,i)=>{let d=Math.hypot((p[0]-q[0])*c.width/100,(p[1]-q[1])*c.height/100);if(d<best){best=d;active=i}});if(best>45){active=-1;return}c.setPointerCapture(e.pointerId);e.preventDefault()};
c.onpointermove=e=>{if(active<0)return;let p=pos(e);if(args.mode==='quad')points[active][0]=Math.max(0,Math.min(100,p[0]));points[active][1]=Math.max(0,Math.min(100,p[1]));draw()};
c.onpointerup=e=>{if(active<0)return;active=-1;send('streamlit:setComponentValue',{value:points,dataType:'json'})};c.onpointercancel=()=>{active=-1};
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;document.getElementById('help').textContent=args.mode==='quad'?'4つの点を紙の四隅へ動かしてください。':'赤・緑・青の各線を、上・中央・下の文字の行に合わせてください。点は上下に動きます。';if(identity!==args.identity){identity=args.identity;points=args.points.map(p=>p.slice());img.onload=size;img.src=args.image}else size()});window.addEventListener('resize',size);send('streamlit:componentReady',{apiVersion:1});
</script>
